name: Rust checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rust-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  CARGO_HOME: ${{ github.workspace }}/.cargo-home
  CARGO_TARGET_DIR: ${{ github.workspace }}/target
  PYTHONDONTWRITEBYTECODE: "1"
jobs:
  linux:
    name: Linux (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
      - name: Prepare pinned prototype test dependencies
        run: |
          mkdir -p target/ci-tools
          curl --fail --location --silent --show-error --retry 3 \
            https://github.com/junegunn/fzf/releases/download/v0.74.5/fzf-0.74.5-linux_amd64.tar.gz \
            -o target/ci-tools/fzf.tar.gz
          echo 'd47d7f882972c7d674dbbba998ffa4116e68379616ffac7695d0671e9a722c5f  target/ci-tools/fzf.tar.gz' | sha256sum -c
          tar -xzf target/ci-tools/fzf.tar.gz -C target/ci-tools fzf
          echo "$PWD/target/ci-tools" >> "$GITHUB_PATH"
          target/ci-tools/fzf --version
          python3 -c 'import compression.zstd'
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: "NO_COLOR=1 cargo test --locked tui::"
      - run: python3 tests/rust_tui_pty.py
      - run: python3 tests/rust_cli_recovery.py
      - run: python3 -m unittest discover -s tests -p 'test_*.py'
      - run: cargo build --release --locked
      - run: MASS_TEST_BINARY="$PWD/target/release/mass" python3 tests/rust_tui_pty.py
      - run: MASS_TEST_BINARY="$PWD/target/release/mass" python3 tests/rust_cli_recovery.py
      - run: python3 scripts/demo.py --check
      - run: bash scripts/package.sh
      - name: Verify archive checksum and fresh-home package behavior
        run: |
          (cd dist && sha256sum -c ./*.tar.gz.sha256)
          python3 tests/rust_package_smoke.py
